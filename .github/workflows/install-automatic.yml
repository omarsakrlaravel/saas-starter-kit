name: Installation Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

jobs:
  install-smoke-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: pdo_sqlite

    - name: Cache Composer Packages
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Composer Dependencies
      run: composer install --no-progress --prefer-dist

    - name: Install Node Dependencies
      run: npm ci

    - name: Build Assets
      run: npm run build

    - name: Copy .env file
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Create SQLite database
      run: touch database/database.sqlite

    - name: Run Migrations and Seed
      run: |
        php artisan migrate --force
        php artisan db:seed --force

    - name: Start Laravel server
      run: |
        php artisan serve &
        echo $! > laravel_server.pid

    - name: Wait for server to start
      run: sleep 5

    - name: Check homepage is accessible
      run: |
        response=$(curl -sS -o homepage.html -w "%{http_code}" http://localhost:8000)
        if [ $response -eq 200 ]; then
          echo "Homepage is accessible"
        else
          echo "Homepage is not accessible. HTTP status code: $response"
          cat homepage.html
          exit 1
        fi

    - name: Stop Laravel server
      if: always()
      run: |
        if [ -f laravel_server.pid ]; then
          kill $(cat laravel_server.pid) || true
        fi
